<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>結帳｜匡老三代購網</title>
    <link rel="icon" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css?v=202607250925">
  </head>
  <body>
    <div id="site-header"></div>
    <main class="container">
      <section class="page-title page-title--checkout">
        <p class="eyebrow">CHECKOUT</p>
        <div class="checkout-title-row">
          <h1>送出訂單</h1>
          <div class="checkout-loyalty-strip" id="checkout-loyalty"></div>
        </div>
      </section>
      <section class="layout-grid">
        <form class="panel" id="checkout-form">
          <h2>收件人資料</h2>
          <div class="form-grid">
            <div class="form-field"><label for="customer-name">姓名</label><input id="customer-name" required></div>
            <div class="form-field"><label for="customer-phone">手機號碼</label><input id="customer-phone" required inputmode="tel"></div>
            <div class="form-field"><label for="customer-email">Email</label><input id="customer-email" required type="email"></div>
            <div class="form-field"><label for="customer-line">LINE ID（選填）</label><input id="customer-line"></div>
          </div>
          <h2 style="margin-top:28px">收件方式</h2>
          <div class="form-grid">
            <div class="form-field"><label for="shipping-method">收件方式</label><select id="shipping-method" required>
              <option value="店到店">店到店</option>
              <option value="面交">面交</option>
              <option value="宅配（限大件物品）">宅配（限大件物品）</option>
            </select></div>
            <div class="form-field form-field--full" data-shipping-field="address"><label for="shipping-address">收件地址</label><input id="shipping-address" placeholder="宅配請填寫完整地址"></div>
            <div class="form-field" data-shipping-field="store"><label for="store-name">711 門市名稱</label><input id="store-name" placeholder="請填寫 711 門市名稱"></div>
            <div class="form-field" data-shipping-field="store"><label for="store-code">門市店號（可不填）</label><input id="store-code" placeholder="可填寫，沒有可不填"></div>
          </div>
          <h2 style="margin-top:28px">付款與備註</h2>
          <div class="form-grid">
            <div class="form-field">
              <label for="payment-method">付款方式</label>
              <select id="payment-method" required>
                <option value="LINE Pay">LINE Pay</option>
                <option value="銀行匯款">銀行匯款</option>
              </select>
              <p class="payment-method-note is-hidden" id="payment-method-note"></p>
            </div>
            <div class="form-field form-field--full"><label for="customer-note">備註</label><textarea id="customer-note" placeholder="可填商品偏好、面交地點或其他提醒"></textarea></div>
          </div>
          <div class="checkout-agreements">
            <label class="checkbox-field"><input id="agree-preorder" type="checkbox" required><span>我已確認商品為代購或預購商品</span></label>
            <div class="checkbox-field checkbox-field--action">
              <input id="agree-policy" type="checkbox" required>
              <span>我已閱讀付款與退換貨說明</span>
              <button class="inline-text-button" type="button" data-open-policy>查看說明</button>
            </div>
            <div class="checkbox-field checkbox-field--action">
              <input id="agree-payment" type="checkbox" required>
              <span>我同意送出訂單後於期限內完成付款或訂金匯款</span>
              <button class="inline-text-button" type="button" data-open-policy>查看說明</button>
            </div>
          </div>
          <button class="btn btn--primary" type="submit" style="width:100%;margin-top:22px">送出訂單</button>
        </form>
        <aside class="checkout-side">
          <div class="panel" id="checkout-items">
            <h2>訂單商品</h2>
            <p class="muted">正在整理商品明細。</p>
          </div>
          <div class="panel" id="checkout-summary">
            <h2>訂單金額</h2>
            <p class="muted">正在計算訂單金額。</p>
          </div>
        </aside>
      </section>
    </main>
    <div class="modal-backdrop is-hidden" id="policy-modal" role="dialog" aria-modal="true" aria-labelledby="policy-modal-title">
      <div class="modal-card">
        <button class="modal-close" type="button" data-close-policy aria-label="關閉說明">×</button>
        <p class="eyebrow">PAYMENT POLICY</p>
        <h2 id="policy-modal-title">付款與退換貨說明</h2>
        <div class="policy-list">
          <section>
            <h3>付款說明</h3>
            <p>每筆訂單成立前需先支付訂單總金額 50% 作為訂金，系統會自動計算訂金與尾款。</p>
          </section>
          <section>
            <h3>訂單成立</h3>
            <p>下單後請於期限內完成付款或匯款回填；訂金確認後，訂單才會正式成立並安排採買。</p>
          </section>
          <section>
            <h3>退換貨說明</h3>
            <p>代購與預購商品下單後會依訂單採買。若商品缺貨，會協助更換品項、保留款項或退款處理。</p>
          </section>
        </div>
        <button class="btn btn--primary" type="button" data-close-policy>我知道了</button>
      </div>
    </div>
    <div class="modal-backdrop is-hidden" id="payment-modal" role="dialog" aria-modal="true" aria-labelledby="payment-modal-title">
      <div class="modal-card modal-card--payment">
        <p class="eyebrow">PAYMENT INFO</p>
        <h2 id="payment-modal-title">匯款資訊</h2>
        <div id="payment-modal-summary"></div>
        <div id="payment-modal-bank"></div>
        <div class="modal-actions">
          <button class="btn btn--ghost" id="payment-copy-button" type="button">複製匯款資訊</button>
          <a class="btn btn--primary" id="payment-success-link" href="order-success.html">查看訂單</a>
        </div>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module">
      import { initSiteChrome } from "./js/auth.js?v=202607242329";
      import { initCheckoutPage } from "./js/checkout.js?v=202607252330";
      initSiteChrome("cart");
      initCheckoutPage();
    </script>
  </body>
</html>
